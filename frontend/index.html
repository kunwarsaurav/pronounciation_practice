<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronunciation Coach</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="glass-container">
        <header>
            <h1>Pronunciation Coach</h1>
            <p>Master your English accent with AI-powered feedback.</p>
        </header>

        <section class="vocabulary-section">
            <h3>Suggested Vocabulary</h3>
            <div class="chips-container" id="vocabChips">
                <button class="chip">Pronunciation</button>
                <button class="chip">Entrepreneur</button>
                <button class="chip">Comfortable</button>
                <button class="chip">Vocabulary</button>
                <button class="chip">Specifically</button>
            </div>
        </section>

        <section class="input-section">
            <div class="input-group">
                <i class="fa-solid fa-bullseye"></i>
                <input type="text" id="targetWord" placeholder="Type a word to practice...">
            </div>
            
            <div class="toggle-container">
                <input type="radio" id="modeIndividual" name="mode" value="individual" checked>
                <label for="modeIndividual" class="toggle-label"><i class="fa-solid fa-microphone-lines"></i> Word</label>
                
                <input type="radio" id="modeSentence" name="mode" value="sentence">
                <label for="modeSentence" class="toggle-label"><i class="fa-solid fa-quote-left"></i> Sentence</label>
                <div class="toggle-slider"></div>
            </div>
            
            <p id="modeInstruction" class="mode-instruction">Pronounce the selected word clearly.</p>
        </section>

        <section class="record-section">
            <button id="recordBtn" class="record-btn">
                <div class="mic-icon-wrapper">
                    <i class="fa-solid fa-microphone"></i>
                </div>
                <span>Start Recording</span>
            </button>
            <p id="statusMsg" class="status-msg">Ready when you are.</p>
        </section>

        <section class="results-section hidden" id="resultsSection">
            <div class="score-card">
                <div class="circular-progress" id="scoreCircle">
                    <span class="progress-value" id="scoreValue">0</span>
                </div>
                <div class="score-details">
                    <h3 id="scoreTitle">Great Job!</h3>
                    <p>Target Word: <strong id="resTargetWord">...</strong></p>
                    <p>We heard: <strong id="resRecognizedWord">...</strong></p>
                </div>
            </div>

            <div class="feedback-card" id="feedbackCard">
                <h3><i class="fa-solid fa-wand-magic-sparkles"></i> AI Coaching Tips</h3>
                <ul id="feedbackList">
                    <!-- Feedback injected here -->
                </ul>
            </div>
        </section>

    </main>

    <footer class="app-footer">
        &copy; 2026 SynthBit. All Rights Reserved.
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
