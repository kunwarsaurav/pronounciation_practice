<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronunciation Scoring Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.6;
        }
        h1 { color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.5rem; }
        input[type="text"] {
            width: 100%; padding: 0.5rem; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 4px;
        }
        .radio-group { margin-bottom: 1rem; }
        .btn-group { display: flex; gap: 1rem; margin-bottom: 2rem; }
        button {
            padding: 0.5rem 1rem; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold; color: white;
        }
        #recordBtn { background-color: #e74c3c; }
        #recordBtn:disabled { background-color: #f5b7b1; cursor: not-allowed; }
        #stopBtn { background-color: #2ecc71; }
        #stopBtn:disabled { background-color: #a9dfbf; cursor: not-allowed; }
        
        #status { font-weight: bold; margin-bottom: 1rem; color: #555; }
        .recording { color: #e74c3c !important; animation: blink 1s infinite; }
        
        @keyframes blink { 50% { opacity: 0.5; } }
        
        pre {
            background: #f4f4f4; padding: 1rem; border-radius: 4px;
            overflow-x: auto; white-space: pre-wrap; word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>Pronunciation Practice Demo</h1>
    
    <div class="form-group">
        <label for="targetWord">Target Word:</label>
        <input type="text" id="targetWord" placeholder="e.g., apple, spectacular, pronunciation" required>
    </div>

    <div class="radio-group">
        <label>Mode:</label>
        <input type="radio" id="modeIndividual" name="mode" value="individual" checked>
        <label for="modeIndividual" style="display:inline; font-weight:normal;">Individual Word</label>
        
        <input type="radio" id="modeSentence" name="mode" value="sentence">
        <label for="modeSentence" style="display:inline; font-weight:normal;">Sentence</label>
    </div>

    <div class="btn-group">
        <button id="recordBtn">🎙️ Start Recording</button>
        <button id="stopBtn" disabled>⏹️ Stop & Score</button>
    </div>

    <div id="status">Ready.</div>
    
    <h3>Result:</h3>
    <pre id="resultBox">No results yet.</pre>

    <script>
        let mediaRecorder;
        let audioChunks = [];

        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusEl = document.getElementById('status');
        const resultBox = document.getElementById('resultBox');
        
        // Base URL for your FastAPI backend
        const API_BASE = "http://localhost:8000";

        // Setup Media Recorder
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    audioChunks = [];
                    await sendAudioToBackend(audioBlob);
                };
            })
            .catch(err => {
                statusEl.textContent = "Error accessing microphone: " + err;
                console.error(err);
            });

        recordBtn.onclick = () => {
            const targetWord = document.getElementById('targetWord').value;
            if (!targetWord) {
                alert("Please enter a target word first!");
                return;
            }
            audioChunks = [];
            mediaRecorder.start();
            recordBtn.disabled = true;
            stopBtn.disabled = false;
            statusEl.textContent = "Recording...";
            statusEl.classList.add("recording");
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            statusEl.textContent = "Processing... (This might take a few seconds)";
            statusEl.classList.remove("recording");
            resultBox.textContent = "Loading...";
        };

        async function sendAudioToBackend(audioBlob) {
            const targetWord = document.getElementById('targetWord').value;
            const mode = document.querySelector('input[name="mode"]:checked').value;
            
            const formData = new FormData();
            formData.append("target_word", targetWord);
            // Append file with a generic .wav name
            formData.append("audio", audioBlob, "recording.wav");
            
            const endpoint = mode === "individual" ? "/score/individual" : "/score/sentence";
            const url = `${API_BASE}${endpoint}`;

            try {
                const response = await fetch(url, {
                    method: "POST",
                    body: formData
                });
                
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Server returned ${response.status}: ${errText}`);
                }

                const data = await response.json();
                resultBox.textContent = JSON.stringify(data, null, 2);
                statusEl.textContent = "Done.";
            } catch (err) {
                console.error(err);
                resultBox.textContent = `Error: ${err.message}`;
                statusEl.textContent = "Failed to get score.";
            }
        }
    </script>
</body>
</html>
